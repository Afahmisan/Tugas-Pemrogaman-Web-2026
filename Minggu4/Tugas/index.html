<!DOCTYPE html> 

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>
  <link rel="stylesheet" href="styles.css">
  
  <script src="kalkulator.js" defer></script>     

</head>
<body>
    <div class="calculator-container">
        <h1>Kalkulator Sederhana</h1>
        <form id="calculator-form">
        <input type="number" id="num1" placeholder="Masukkan angka pertama" required>
        <select id="operator" required>

            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="Masukkan angka kedua" required>
        
        <button type="submit" id = "hitung">Hitung</button>
        </form>
        <p>Hasil: <span id="result"></span></p>
        
    </div>              
</body>
</html>
